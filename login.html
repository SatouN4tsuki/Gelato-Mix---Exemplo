<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelato Mix - Entrar</title>
    <meta name="description" content="Entre na sua conta Gelato Mix para montar seu pedido de gelatos artesanais.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-login">

    <div class="login-card">
        <a href="index.html" class="back-link">← Voltar</a>
        
        <h1 class="brand-title">GELATO MIX</h1>
        <p class="login-subtitle">Faça login para montar seu carrinho</p>

        <form id="form-login">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="nome@exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Entrar na Loja</button>
        </form>
    </div>

    <script src="js/scripts.js"></script>
</body>
</html>
